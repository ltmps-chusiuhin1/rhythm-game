<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythm Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030305;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    #game-wrapper {
      position: relative;
      width: 1100px;
      height: 680px;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
    }
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .touch-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- 賽季背景音樂 -->
  <audio id="bgm-season1" src="https://ltmps-chusiuhin.github.io/rhythm-game/30.mp3" preload="auto" style="display:none;"></audio>
  <audio id="bgmPlayer" style="display:none;"></audio>

  <!-- 遊戲背景與容器 -->
  <div class="bg-layer"></div>
  <div id="game-wrapper">
    <canvas id="gameCanvas" width="1100" height="680"></canvas>
    <div id="touch-p1" class="touch-layer"></div>
  </div>

  <script>
    // 遊戲邏輯與 Canvas 初始化程式碼放置於此
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 測試繪製文字
    ctx.fillStyle = '#00f2fe';
    ctx.font = '30px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Rhythm Game Ready', canvas.width / 2, canvas.height / 2);
  </script>

</body>
</html>
